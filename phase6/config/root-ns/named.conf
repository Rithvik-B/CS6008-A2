// root-ns — authoritative-only for the root zone (.)
options {
    directory "/var/cache/bind";
    recursion no;                 // authoritative servers never recurse
    dnssec-validation no;         // Phase 1: no DNSSEC anywhere
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    minimal-responses no;         // emit full referrals so the chain is visible on the wire
};
zone "." {
    type master;
    file "/etc/bind/db.root.signed";
};
