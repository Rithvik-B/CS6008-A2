// resolver — recursive caching resolver, DNSSEC validation OFF (Phase 1)
options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation no;         // Phase 1 baseline: trust whatever comes back
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
    qname-minimization disabled;  // keep full QNAMEs on the wire so the capture is legible
};
// Our private root hints override BIND's built-in Internet root hints.
zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};
