include "/etc/bind/rndc.key";
include "/etc/bind/trust-anchor.conf";   // root KSK (generated by sign/sign-all.sh)

// DoT: private-CA certificate for resolver.cs6008.local (generated by pki/make-ca.sh)
tls local-tls {
    cert-file "/etc/bind/tls/resolver.crt";
    key-file  "/etc/bind/tls/resolver.key";
};
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

// resolver — recursive caching resolver, DNSSEC validation OFF (Phase 1)
options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;        // Phase 3: validate against our root trust anchor
    listen-on { any; };                       // plain DNS on 53 (for fallback demo)
    listen-on port 853 tls local-tls { any; };// DoT on 853 (encrypted last mile)
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
    qname-minimization disabled;  // keep full QNAMEs on the wire so the capture is legible
};
// Our private root hints override BIND's built-in Internet root hints.
zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};
