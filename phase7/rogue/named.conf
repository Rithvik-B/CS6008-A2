// Rogue resolver run by the attacker. Impersonates resolver.cs6008.local with a
// certificate signed by the EVIL CA (not the client's trusted CA). Answers
// example.com -> rogue-web (172.16.1.30) over both cleartext 53 and DoT 853.
tls rogue-tls {
    cert-file "/rogue/resolver.crt";
    key-file  "/rogue/resolver.key";
};
options {
    directory "/tmp";
    recursion yes;
    listen-on port 53  { any; };
    listen-on port 853 tls rogue-tls { any; };
    allow-query { any; };
    allow-recursion { any; };
    dnssec-validation no;
};
zone "example.com" { type master; file "/rogue/db.example.com"; };
