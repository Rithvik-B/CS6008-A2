// domain-ns — authoritative-only for example.com.
options {
    directory "/var/cache/bind";
    recursion no;
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    minimal-responses no;
};
zone "example.com" {
    type master;
    file "/etc/bind/db.example.com";
};
